spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
        response-format:
          type: JSON_OBJECT
  application:
    name: Qgents
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_AUTH_CODE}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000


github:
  app:
    app-id: ${GITHUB_APP_ID:}
    slug: ${GITHUB_APP_SLUG:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    callback-url: ${GITHUB_APP_CALLBACK_URL:}
    state-secret: ${GITHUB_APP_STATE_SECRET:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  invitation-url: ${INVITATION_URL:http://localhost:5173/team-invitations/accept}
  registration-url: ${REGISTRATION_URL:http://localhost:5173/register}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rsa-private-key: ${RSA_PRIVATE_KEY_PATH:file:./src/main/resources/rsa/private_key.pem}
  rsa-key-id: ${RSA_KEY_ID:rsa-2026-08}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
  # 附件直传凭证：对象存储未接入前默认返回本地签名 URL，接入后由对应策略替换
  attachment-upload-base: ${ATTACHMENT_UPLOAD_BASE:/api/v1/internal/attachments}
  attachment-signing-secret: ${ATTACHMENT_SIGNING_SECRET:dev-only-change-me}
  attachment-upload-expiry-seconds: ${ATTACHMENT_UPLOAD_EXPIRY_SECONDS:900}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  type-handlers-package: qg.qgent.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
