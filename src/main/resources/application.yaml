spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
        response-format:
          type: JSON_OBJECT
  application:
    name: Qgents
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_AUTH_CODE}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  async:
    workflow:
      core-pool-size: ${WORKFLOW_ASYNC_CORE_POOL_SIZE:4}
      max-pool-size: ${WORKFLOW_ASYNC_MAX_POOL_SIZE:8}
      queue-capacity: ${WORKFLOW_ASYNC_QUEUE_CAPACITY:100}
      await-termination-seconds: ${WORKFLOW_ASYNC_AWAIT_TERMINATION_SECONDS:30}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rsa-private-key: ${RSA_PRIVATE_KEY_PATH:file:./src/main/resources/rsa/private_key.pem}
  rsa-key-id: ${RSA_KEY_ID:rsa-2026-08}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  reset-token-minutes: ${RESET_TOKEN_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: qg.qgent.entity
  type-handlers-package: qg.qgent.typehandler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

exchange-rate:
  api-key: ${EXCHANGERATE_API_KEY:}

  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
  logs:
    enabled: true
