spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
        response-format:
          type: JSON_OBJECT
  application:
    name: Qgents
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_AUTH_CODE}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId}] %logger{36} : %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId}] %logger{36} : %msg%n"


# TODO(Deployment): 部署到生产环境（有真实的公网域名）时，必须在 GitHub 开发者后台创建一个全新的 GitHub App。
# 注意1：生产环境的 GitHub App 必须将其 Callback URL 配置为线上真实的 HTTPS 域名地址（例如 https://api.qgents.com/api/v1/integrations/github/callback），否则将面临严重的安全泄露风险并被 GitHub 拦截。
# 注意2：必须同时在 GitHub App 设置中开启并配置 Webhook 功能（Webhook URL 及 Webhook Secret），用于接收仓库的动态事件（如 MR 状态、代码推送等）。
github:
  app:
    app-id: ${GITHUB_APP_ID:}
    slug: ${GITHUB_APP_SLUG:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    callback-url: ${GITHUB_APP_CALLBACK_URL:}
    state-secret: ${GITHUB_APP_STATE_SECRET:}
  # Webhook 验签 Secret；只从环境变量注入，未配置时 Webhook 接口返回 503 fail-closed
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
    max-body-bytes: ${GITHUB_WEBHOOK_MAX_BODY_BYTES:1048576}

app:
  diff-snapshot-root: ${DIFF_SNAPSHOT_ROOT:./data/diff-snapshots}
  # 本地 Workspace 代码根目录（真实 Sandbox 接入前的临时约定，未配置则 Plan Agent 读到空文件树）
  workspace:
    base-dir: ${WORKSPACE_BASE_DIR:}
  # 后端2 Sandbox Worker 客户端配置；enabled=true 时编排链路改走 Worker HTTP API
  worker:
    base-url: ${SANDBOX_WORKER_URL:http://localhost:8091}
    enabled: ${SANDBOX_WORKER_ENABLED:false}
    backend-service-token: ${SANDBOX_BACKEND_SERVICE_TOKEN:}
    image-profile: ${SANDBOX_IMAGE_PROFILE:java-node}
    poll-interval: ${SANDBOX_POLL_INTERVAL:250ms}
    poll-timeout: ${SANDBOX_POLL_TIMEOUT:15m}
    lease-renew-interval: ${SANDBOX_LEASE_RENEW_INTERVAL:10s}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  frontend-url-web: ${FRONTEND_URL_WEB:${FRONTEND_URL:http://localhost:5173}}
  frontend-url-mobile: ${FRONTEND_URL_MOBILE:${FRONTEND_URL:http://localhost:5173}}
  invitation-url: ${INVITATION_URL:http://localhost:5173/team-invitations/accept}
  registration-url: ${REGISTRATION_URL:http://localhost:5173/register}
  # 浏览器前端来源；生产环境可通过 CORS_ALLOWED_ORIGINS 覆盖并追加自定义域名
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://qgents.dpdns.org,http://localhost:5173,http://127.0.0.1:5173}
  rsa-private-key: ${RSA_PRIVATE_KEY_PATH:file:./src/main/resources/rsa/private_key.pem}
  rsa-key-id: ${RSA_KEY_ID:rsa-2026-08}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
  # 附件直传凭证：对象存储未接入前默认返回本地签名 URL，接入后由对应策略替换
  attachment-upload-base: ${ATTACHMENT_UPLOAD_BASE:/api/v1/internal/attachments}
  attachment-signing-secret: ${ATTACHMENT_SIGNING_SECRET:dev-only-change-me}
  attachment-upload-expiry-seconds: ${ATTACHMENT_UPLOAD_EXPIRY_SECONDS:900}
  # 附件大小上限（字节，默认 50MB）与临时下载地址有效期（秒，默认 900）
  attachment-max-size-bytes: ${APP_ATTACHMENT_MAX_SIZE_BYTES:52428800}
  attachment-download-expiry-seconds: ${APP_ATTACHMENT_DOWNLOAD_EXPIRY_SECONDS:900}
  # Agent 默认预置：启动时为每个 ACTIVE 团队补齐 DEVELOPER/TESTER/REVIEWER Agent（保证回群/方案 A 能查到匹配 Agent）
  agent-preseed:
    enabled: ${APP_AGENT_PRESEED_ENABLED:true}

# 阿里云 OSS 对象存储（附件真实存储）；密钥只通过环境变量注入，禁止写死或提交
aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    presign-expiry-seconds: ${ALIYUN_OSS_PRESIGN_EXPIRY_SECONDS:900}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sandbox:
  backend-service-token: ${SANDBOX_BACKEND_SERVICE_TOKEN:dev-only-secret-token}


mybatis-plus:
  type-handlers-package: qg.qgent.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
