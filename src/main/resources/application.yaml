spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      # Qwen3-VL-Plus（DashScope OpenAI 兼容）：支持图片/文件多模态输入。
      # 回退 DeepSeek：api-key=${DEEPSEEK_API_KEY} / base-url=https://api.deepseek.com/ / model=deepseek-v4-flash
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3-vl-plus
          temperature: 0.2
          max-tokens: 8192
  application:
    name: Qgents
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池保护：不盲目调大池，而是给获取连接加硬超时（耗尽时快速失败而非挂起请求线程）、
    # 启用连接泄漏检测（阈值内未归还的连接由 Hikari 记录告警，便于定位未释放点）与
    # 定期清理陈旧连接。参数可经环境变量覆盖（生产按实际 QPS/事务耗时核算）。
    hikari:
      # 获取连接的最长等待：池耗尽时在此期限内返回 503/超时，而不是让请求线程无限排队
      connection-timeout: ${DB_CONNECTION_TIMEOUT:8000}
      # 连接有效性校验的最长等待：获取连接前的活连接探测不超过此值
      validation-timeout: ${DB_VALIDATION_TIMEOUT:2000}
      # 最大池大小（默认 10）；并发任务编排 + SSE 轮询 + 前端查询叠加时按实测调整
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      # 最小空闲连接：低峰期保留少量就绪连接，避免频繁建连
      minimum-idle: ${DB_MIN_IDLE:2}
      # 连接最大存活时间略短于 MySQL wait_timeout，避免服务端断连后复用失效连接
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      # 空闲连接回收前的最大空闲时间
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      # 连接泄漏检测：超过该时长未归还的连接由 Hikari 打堆栈告警（默认 0=关闭；
      # 置 60s 便于在连接池耗尽时从日志定位未关闭的连接点，不影响正常长事务）
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}
      # 获取连接后的连通性测试（IS_VALID），配合 validation-timeout 保证拿到的是活连接
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_AUTH_CODE}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  file:
    name: ${LOG_FILE:logs/qgents.log}
  # 输出格式与滚动策略见 logback-spring.xml；排查 SQL 时将 qg.qgent.mapper 设为 DEBUG


# TODO(Deployment): 部署到生产环境（有真实的公网域名）时，必须在 GitHub 开发者后台创建一个全新的 GitHub App。
# 注意1：生产环境的 GitHub App 必须将其 Callback URL 配置为线上真实的 HTTPS 域名地址（例如 https://api.qgents.com/api/v1/integrations/github/callback），否则将面临严重的安全泄露风险并被 GitHub 拦截。
# 注意2：必须同时在 GitHub App 设置中开启并配置 Webhook 功能（Webhook URL 及 Webhook Secret），用于接收仓库的动态事件（如 MR 状态、代码推送等）。
github:
  # GitHub 客户端专用 HTTP 代理。仅当环境显式配置 GITHUB_PROXY_HOST/GITHUB_PROXY_PORT 时启用，
  # 不再兜底 JVM 的 -Dhttps.proxyHost，避免 IntelliJ 启动参数把本机代理变成强制依赖。
  proxy:
    host: ${GITHUB_PROXY_HOST:}
    port: ${GITHUB_PROXY_PORT:0}
  app:
    app-id: ${GITHUB_APP_ID:}
    slug: ${GITHUB_APP_SLUG:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    callback-url: ${GITHUB_APP_CALLBACK_URL:}
    state-secret: ${GITHUB_APP_STATE_SECRET:}
  oauth:
    enabled: ${GITHUB_OAUTH_ENABLED:false}
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    authorize-url: ${GITHUB_OAUTH_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
    token-url: ${GITHUB_OAUTH_TOKEN_URL:https://github.com/login/oauth/access_token}
    user-url: ${GITHUB_OAUTH_USER_URL:https://api.github.com/user}
    callback-url: ${GITHUB_OAUTH_CALLBACK_URL:}
    state-secret: ${GITHUB_OAUTH_STATE_SECRET:}
    token-encryption-key: ${GITHUB_OAUTH_TOKEN_ENCRYPTION_KEY:}
    scopes: ${GITHUB_OAUTH_SCOPES:repo}
    state-ttl-seconds: ${GITHUB_OAUTH_STATE_TTL_SECONDS:600}
  # Webhook 验签 Secret；只从环境变量注入，未配置时 Webhook 接口返回 503 fail-closed
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
    max-body-bytes: ${GITHUB_WEBHOOK_MAX_BODY_BYTES:1048576}

app:
  diff-snapshot-root: ${DIFF_SNAPSHOT_ROOT:./data/diff-snapshots}
  # 本地 Workspace 代码根目录（真实 Sandbox 接入前的临时约定，未配置则 Plan Agent 读到空文件树）
  workspace:
    base-dir: ${WORKSPACE_BASE_DIR:}
  # 后端2 Sandbox Worker 客户端配置；enabled=true 时编排链路改走 Worker HTTP API
  worker:
    base-url: ${SANDBOX_WORKER_URL:http://localhost:8091}
    enabled: ${SANDBOX_WORKER_ENABLED:false}
    backend-service-token: ${SANDBOX_BACKEND_SERVICE_TOKEN:}
    image-profile: ${SANDBOX_IMAGE_PROFILE:dev-tools}
    poll-interval: ${SANDBOX_POLL_INTERVAL:250ms}
    poll-timeout: ${SANDBOX_POLL_TIMEOUT:15m}
    lease-renew-interval: ${SANDBOX_LEASE_RENEW_INTERVAL:10s}
    # 初始化阶段（同步 Git Store + 准备 Workspace）自动重试：最大尝试次数与初始退避，
    # 瞬态失败在此上限内重试，退避为 initial * 2^(n-1)，耗尽后走 Task 失败链路
    acquire-max-attempts: ${SANDBOX_ACQUIRE_MAX_ATTEMPTS:3}
    acquire-initial-backoff: ${SANDBOX_ACQUIRE_INITIAL_BACKOFF:1s}
    # 连接/响应硬超时：Worker 请求挂起时在此期限内转为 SANDBOX_WORKER_UNAVAILABLE，不占住编排线程
    connect-timeout: ${SANDBOX_WORKER_CONNECT_TIMEOUT:5s}
    response-timeout: ${SANDBOX_WORKER_RESPONSE_TIMEOUT:30s}
  # Coding/Review Agent 与 LLM 的工具调用协议（阶段 B）：native=Spring AI 原生 Tool Calling（默认）；
  # legacy=旧手写 JSON 文本协议（灰度期回退用，稳定后删除）
  agent:
    protocol: ${APP_AGENT_PROTOCOL:native}
    context:
      # 全量注入 Agent 上下文的已批准 Memory 标题与正文总字符上限；超过时禁止批准。
      max-approved-memory-chars: ${APP_AGENT_CONTEXT_MAX_APPROVED_MEMORY_CHARS:12000}
    # 每个 TaskRun 内 search_chat_history 检索工具调用次数上限（避免 Agent 反复刷检索撑爆上下文）
    context-search:
      max-per-run: ${APP_AGENT_CONTEXT_SEARCH_MAX_PER_RUN:10}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  frontend-url-web: ${FRONTEND_URL_WEB:${FRONTEND_URL:http://localhost:5173}}
  frontend-url-mobile: ${FRONTEND_URL_MOBILE:${FRONTEND_URL:http://localhost:5173}}
  invitation-url: ${INVITATION_URL:http://localhost:5173/team-invitations/accept}
  registration-url: ${REGISTRATION_URL:http://localhost:5173/register}
  # 浏览器前端来源；生产环境可通过 CORS_ALLOWED_ORIGINS 覆盖并追加自定义域名
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://qgents.dpdns.org,http://localhost:5173,http://127.0.0.1:5173}
  rsa-private-key: ${RSA_PRIVATE_KEY_PATH:file:./src/main/resources/rsa/private_key.pem}
  rsa-key-id: ${RSA_KEY_ID:rsa-2026-08}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
  # 附件直传凭证：对象存储未接入前默认返回本地签名 URL，接入后由对应策略替换
  attachment-upload-base: ${ATTACHMENT_UPLOAD_BASE:/api/v1/internal/attachments}
  attachment-signing-secret: ${ATTACHMENT_SIGNING_SECRET:dev-only-change-me}
  attachment-upload-expiry-seconds: ${ATTACHMENT_UPLOAD_EXPIRY_SECONDS:900}
  # 附件大小上限（字节，默认 50MB）与临时下载地址有效期（秒，默认 900）
  attachment-max-size-bytes: ${APP_ATTACHMENT_MAX_SIZE_BYTES:52428800}
  attachment-download-expiry-seconds: ${APP_ATTACHMENT_DOWNLOAD_EXPIRY_SECONDS:900}
  # Agent 默认预置：建团队事务内补齐团队默认 Agent（PLANNER/DEVELOPER/TESTER/REVIEWER + 编排助手）；
  # 启动时为存量 ACTIVE 团队幂等兜底（DefaultAgentProvisioner）
  agent-preseed:
    enabled: ${APP_AGENT_PRESEED_ENABLED:true}

# 阿里云 OSS 对象存储（附件真实存储）；密钥只通过环境变量注入，禁止写死或提交
aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    presign-expiry-seconds: ${ALIYUN_OSS_PRESIGN_EXPIRY_SECONDS:900}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 运行指标端点仅用于内网/受控监控访问，不纳入业务接口文档。
management:
  server:
    # 本地 Prometheus 专用管理端口，不占用业务端口；生产环境必须按部署网络覆盖。
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

sandbox:
  # 内部 Git 凭据接口没有安全默认值；生产与联调均必须显式注入随机 service token。
  backend-service-token: ${SANDBOX_BACKEND_SERVICE_TOKEN:}

# Agent Run 单相位总时限与任务恢复相关配置
qgents:
  executor:
    # 保持当前默认容量；部署时可按 CPU、外部服务限流和实测队列调整。
    orchestration:
      core-size: ${QGENTS_ORCHESTRATION_CORE_SIZE:2}
      max-size: ${QGENTS_ORCHESTRATION_MAX_SIZE:4}
      queue-capacity: ${QGENTS_ORCHESTRATION_QUEUE_CAPACITY:100}
    test-execution:
      core-size: ${QGENTS_TEST_EXECUTION_CORE_SIZE:2}
      max-size: ${QGENTS_TEST_EXECUTION_MAX_SIZE:4}
      queue-capacity: ${QGENTS_TEST_EXECUTION_QUEUE_CAPACITY:100}
    # 任务启动确认（TaskStartedNoticeListener）独立执行器：与分钟级编排池隔离，
    # 保证「已收到你的需求」确认消息毫秒级插入，不被编排长任务排队拖后。
    task-started-notice:
      core-size: ${QGENTS_TASK_STARTED_NOTICE_CORE_SIZE:2}
      max-size: ${QGENTS_TASK_STARTED_NOTICE_MAX_SIZE:4}
      queue-capacity: ${QGENTS_TASK_STARTED_NOTICE_QUEUE_CAPACITY:100}
    task-run-timeout:
      core-size: ${QGENTS_TASK_RUN_TIMEOUT_CORE_SIZE:2}
      max-size: ${QGENTS_TASK_RUN_TIMEOUT_MAX_SIZE:4}
      queue-capacity: ${QGENTS_TASK_RUN_TIMEOUT_QUEUE_CAPACITY:64}
  push:
    # 移动端 FCM HTTP v1 离线推送默认关闭；服务账号密钥只允许由受控环境变量注入。
    enabled: ${QGENTS_PUSH_ENABLED:false}
    fcm-endpoint: ${QGENTS_PUSH_FCM_ENDPOINT:https://fcm.googleapis.com/v1/projects}
    fcm-project-id: ${QGENTS_PUSH_FCM_PROJECT_ID:}
    fcm-service-account-json-base64: ${QGENTS_PUSH_FCM_SERVICE_ACCOUNT_JSON_BASE64:}
    token-encryption-key: ${QGENTS_PUSH_TOKEN_ENCRYPTION_KEY:}
    max-attempts: ${QGENTS_PUSH_MAX_ATTEMPTS:5}
    poll-interval-ms: ${QGENTS_PUSH_POLL_INTERVAL_MS:5000}
  orchestration:
    # 单次 agent.run() 的总时限；超时按基础设施失败落库（failureCode=AGENT_RUN_TIMEOUT）
    coding-timeout: ${QGENTS_CODING_TIMEOUT:10m}
    testing-timeout: ${QGENTS_TESTING_TIMEOUT:15m}
    reviewing-timeout: ${QGENTS_REVIEWING_TIMEOUT:8m}
  task-recovery:
    # 恢复器回收陈旧活跃 Run 的阈值，必须大于最大的相位时限（testing-timeout）
    stale-run-threshold: ${QGENTS_RECOVERY_STALE_RUN:20m}
    poll-delay-ms: ${QGENTS_RECOVERY_POLL_DELAY_MS:30000}
  conflict-resolution:
    # 每个 Task 因合并冲突自动派发"解决冲突"续跑任务的上限；达到上限后改由人工处理。
    max-continuations-per-task: ${QGENTS_CONFLICT_MAX_CONTINUATIONS:3}
    poll-delay-ms: ${QGENTS_CONFLICT_POLL_DELAY_MS:15000}


mybatis-plus:
  type-handlers-package: qg.qgent.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
